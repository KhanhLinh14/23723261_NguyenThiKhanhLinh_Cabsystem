openapi: 3.0.3
info:
  title: CAB System - Trip Management API
  description: OpenAPI specification for BR03 - Trip Management.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Business Requirements
    description: CAB System business requirements

paths:
  /business-requirements/BR03:
    get:
      tags:
        - Business Requirements
      summary: Trip Management
      description: The system supports managing and tracking the trip process.
      responses:
        '200':
          description: Business requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BR03'

components:
  schemas:
    BR03:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
          example: BR03
        name:
          type: string
          example: Trip Management
        description:
          type: string
          example: The system supports managing and tracking the trip process.
