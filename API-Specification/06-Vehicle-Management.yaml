openapi: 3.0.3
info:
  title: CAB System - Vehicle Management API
  description: OpenAPI specification for BR06 - Vehicle Management.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Business Requirements
    description: CAB System business requirements

paths:
  /business-requirements/BR06:
    get:
      tags:
        - Business Requirements
      summary: Vehicle Management
      description: The system supports managing vehicle information.
      responses:
        '200':
          description: Business requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BR06'

components:
  schemas:
    BR06:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
          example: BR06
        name:
          type: string
          example: Vehicle Management
        description:
          type: string
          example: The system supports managing vehicle information.
