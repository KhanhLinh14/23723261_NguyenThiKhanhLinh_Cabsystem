openapi: 3.0.3
info:
  title: CAB System - Fare Calculation API
  description: OpenAPI specification for BR07 - Fare Calculation.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Business Requirements
    description: CAB System business requirements

paths:
  /business-requirements/BR07:
    get:
      tags:
        - Business Requirements
