openapi: 3.0.3
info:
  title: CAB System - Driver Management API
  description: OpenAPI specification for BR05 - Driver Management.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Business Requirements
    description: CAB System business requirements

paths:
  /business-requirements/BR05:
    get:
      tags:
        - Business Requirements
      summary: Driver Management
      description: The system supports managing driver profiles and operating status.
      responses:
        '200':
          description: Business requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BR05'

components:
  schemas:
    BR05:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
          example: BR05
        name:
          type: string
          example: Driver Management
        description:
          type: string
          example: The system supports managing driver profiles and operating status.
