openapi: 3.0.3
info:
  title: CAB System API
  description: |
    API Document cho hệ thống đặt xe trực tuyến CAB System của Công ty ABC.
    Tài liệu được xây dựng dựa trên các yêu cầu, Business Rule và Use Case
    của hệ thống trong tài liệu phân tích.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Local server

tags:
  - name: Tài khoản
  - name: Khách hàng
  - name: Tài xế
  - name: Chuyến xe
  - name: Thanh toán
  - name: Đánh giá
  - name: Quản trị

paths:

  /auth/register:
    post:
      tags: [Tài khoản]
      summary: Đăng ký tài khoản
      description: Cho phép khách hàng hoặc tài xế tạo tài khoản.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Thông tin đăng ký không hợp lệ
        '409':
          description: Tài khoản đã tồn tại
        '500':
          description: Lỗi hệ thống

  /auth/login:
    post:
      tags: [Tài khoản]
      summary: Đăng nhập
      description: Xác thực người dùng và xác định vai trò.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Sai thông tin đăng nhập hoặc tài khoản bị khóa

  /customers/{maKH}:
    get:
      tags: [Khách hàng]
      summary: Xem thông tin khách hàng
      parameters:
        - $ref: '#/components/parameters/MaKH'
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Không tìm thấy khách hàng

    put:
      tags: [Khách hàng]
      summary: Cập nhật thông tin khách hàng
      parameters:
        - $ref: '#/components/parameters/MaKH'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Dữ liệu không hợp lệ
        '404':
          description: Không tìm thấy khách hàng

  /drivers:
    get:
      tags: [Tài xế]
      summary: Danh sách tài xế
      description: Quản trị viên xem danh sách tài xế.
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'

  /drivers/{maTX}/status:
    put:
      tags: [Tài xế]
      summary: Cập nhật trạng thái tài xế
      description: Tài xế cập nhật trạng thái Sẵn sàng hoặc Offline.
      parameters:
        - $ref: '#/components/parameters/MaTX'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '400':
          description: Không thể cập nhật trạng thái
        '409':
          description: Tài xế đang có chuyến

  /vehicles:
    get:
      tags: [Quản trị]
      summary: Danh sách phương tiện
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'

    post:
      tags: [Quản trị]
      summary: Thêm phương tiện
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Thêm phương tiện thành công
        '400':
          description: Dữ liệu không hợp lệ

  /vehicle-types:
    get:
      tags: [Quản trị]
      summary: Danh sách loại xe
      responses:
        '200':
          description: Danh sách loại xe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleType'

    post:
      tags: [Quản trị]
      summary: Thêm loại xe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleTypeRequest'
      responses:
        '201':
          description: Thêm loại xe thành công

  /trips:
    post:
      tags: [Chuyến xe]
      summary: Đặt chuyến xe
      description: |
        Khách hàng nhập điểm đón, điểm đến và loại xe để tạo chuyến.
        Chuyến mới được chuyển sang trạng thái Đang tìm tài xế.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
      responses:
        '201':
          description: Tạo chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Thiếu điểm đón, điểm đến hoặc loại xe
        '401':
          description: Chưa đăng nhập

    get:
      tags: [Quản trị]
      summary: Danh sách chuyến xe
      description: Quản trị viên tìm kiếm và theo dõi các chuyến xe.
      parameters:
        - name: trangThai
          in: query
          schema:
            type: string
            enum:
              - Đang tìm tài xế
              - Đã tìm thấy tài xế
              - Đang nhận chuyến
              - Đang đi
              - Hoàn thành
              - Đã hủy
              - Chờ thanh toán
      responses:
        '200':
          description: Danh sách chuyến xe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /trips/{maChuyen}:
    get:
      tags: [Chuyến xe]
      summary: Xem chi tiết và theo dõi chuyến xe
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      responses:
        '200':
          description: Thông tin chuyến xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Không tìm thấy chuyến xe

  /trips/{maChuyen}/drivers/search:
    get:
      tags: [Chuyến xe]
      summary: Tìm tài xế phù hợp
      description: |
        Tìm tài xế đang Sẵn sàng, phù hợp loại xe và ưu tiên theo vị trí điểm đón.
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      responses:
        '200':
          description: Danh sách tài xế phù hợp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '404':
          description: Không tìm được tài xế phù hợp

  /trips/{maChuyen}/accept:
    post:
      tags: [Tài xế]
      summary: Chấp nhận chuyến
      description: Tài xế đang Sẵn sàng có thể chấp nhận yêu cầu chuyến.
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverTripActionRequest'
      responses:
        '200':
          description: Chấp nhận chuyến thành công
        '409':
          description: Chuyến đã được tài xế khác nhận hoặc tài xế không còn Sẵn sàng

  /trips/{maChuyen}/reject:
    post:
      tags: [Tài xế]
      summary: Từ chối chuyến
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverTripActionRequest'
      responses:
        '200':
          description: Từ chối thành công và hệ thống tiếp tục tìm tài xế khác
        '409':
          description: Chuyến không còn khả dụng

  /trips/{maChuyen}/status:
    put:
      tags: [Chuyến xe]
      summary: Cập nhật trạng thái chuyến
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '400':
          description: Trạng thái không hợp lệ

  /trips/{maChuyen}/location:
    put:
      tags: [Tài xế]
      summary: Cập nhật vị trí tài xế
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Cập nhật vị trí thành công

  /trips/{maChuyen}/cancel:
    post:
      tags: [Chuyến xe]
      summary: Hủy chuyến
      description: Khách hàng hoặc tài xế hủy chuyến theo điều kiện cho phép.
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      responses:
        '200':
          description: Hủy chuyến thành công
        '400':
          description: Chuyến không còn được phép hủy

  /trips/{maChuyen}/fare:
    get:
      tags: [Thanh toán]
      summary: Tính cước chuyến đi
      description: Tính cước theo khoảng cách, thời gian, loại xe và phụ phí nếu có.
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      responses:
        '200':
          description: Kết quả tính cước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'
        '400':
          description: Chuyến chưa hoàn thành

  /trips/{maChuyen}/payment:
    post:
      tags: [Thanh toán]
      summary: Thanh toán chuyến xe
      description: Khách hàng thanh toán bằng tiền mặt hoặc phương thức điện tử.
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Phương thức thanh toán không hợp lệ
        '402':
          description: Thanh toán thất bại

  /trips/{maChuyen}/rating:
    post:
      tags: [Đánh giá]
      summary: Đánh giá tài xế
      description: Khách hàng đánh giá tài xế sau khi chuyến hoàn thành.
      parameters:
        - $ref: '#/components/parameters/MaChuyen'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Đánh giá không hợp lệ
        '409':
          description: Khách hàng đã đánh giá chuyến này

  /admin/customers:
    get:
      tags: [Quản trị]
      summary: Quản lý khách hàng
      description: Quản trị viên xem danh sách khách hàng.
      responses:
        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

  /admin/drivers:
    get:
      tags: [Quản trị]
      summary: Quản lý tài xế
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'

  /admin/reports:
    get:
      tags: [Quản trị]
      summary: Báo cáo hoạt động
      description: Thống kê số chuyến, doanh thu, tỷ lệ hoàn thành và tỷ lệ hủy.
      responses:
        '200':
          description: Báo cáo hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MaKH:
      name: maKH
      in: path
      required: true
      schema:
        type: integer
        example: 1001
    MaTX:
      name: maTX
      in: path
      required: true
      schema:
        type: integer
        example: 2001
    MaChuyen:
      name: maChuyen
      in: path
      required: true
      schema:
        type: integer
        example: 3001

  schemas:

    RegisterRequest:
      type: object
      required: [hoTen, soDienThoai, email, matKhau, vaiTro]
      properties:
        hoTen:
          type: string
          example: Nguyễn Văn A
        soDienThoai:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        matKhau:
          type: string
          format: password
          example: "12345678"
        vaiTro:
          type: string
          enum: [Khách hàng, Tài xế]
          example: Khách hàng

    LoginRequest:
      type: object
      required: [soDienThoai, matKhau]
      properties:
        soDienThoai:
          type: string
          example: "0901234567"
        matKhau:
          type: string
          format: password
          example: "12345678"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        vaiTro:
          type: string
          enum: [Khách hàng, Tài xế, Quản trị viên]
        message:
          type: string
          example: Đăng nhập thành công

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        hoTen:
          type: string
          example: Nguyễn Văn A
        soDienThoai:
          type: string
          example: "0901234567"
        email:
          type: string
          example: nguyenvana@gmail.com
        vaiTro:
          type: string
          example: Khách hàng

    Customer:
      type: object
      properties:
        maKH:
          type: integer
          example: 1001
        hoTen:
          type: string
          example: Nguyễn Văn A
        soDienThoai:
          type: string
          example: "0901234567"
        email:
          type: string
          example: nguyenvana@gmail.com
        diaChi:
          type: string
          example: TP. Hồ Chí Minh

    CustomerUpdateRequest:
      type: object
      properties:
        hoTen:
          type: string
        email:
          type: string
          format: email
        diaChi:
          type: string

    Driver:
      type: object
      properties:
        maTX:
          type: integer
          example: 2001
        hoTen:
          type: string
          example: Trần Văn B
        soDienThoai:
          type: string
          example: "0912345678"
        trangThai:
          type: string
          enum: [Sẵn sàng, Offline, Đang nhận chuyến]
          example: Sẵn sàng
        viTriHienTai:
          type: string
          example: Quận 1, TP. Hồ Chí Minh

    DriverStatusRequest:
      type: object
      required: [trangThai]
      properties:
        trangThai:
          type: string
          enum: [Sẵn sàng, Offline]
          example: Sẵn sàng

    Vehicle:
      type: object
      properties:
        maPT:
          type: integer
          example: 5001
        bienSo:
          type: string
          example: 51A-12345
        mauXe:
          type: string
          example: Toyota Vios
        maTX:
          type: integer
          example: 2001
        maLoaiXe:
          type: integer
          example: 1

    VehicleRequest:
      type: object
      required: [bienSo, mauXe, maTX, maLoaiXe]
      properties:
        bienSo:
          type: string
        mauXe:
          type: string
        maTX:
          type: integer
        maLoaiXe:
          type: integer

    VehicleType:
      type: object
      properties:
        maLoaiXe:
          type: integer
          example: 1
        tenLoaiXe:
          type: string
          example: Xe 4 chỗ
        moTa:
          type: string
          example: Xe phục vụ tối đa 4 hành khách

    VehicleTypeRequest:
      type: object
      required: [tenLoaiXe]
      properties:
        tenLoaiXe:
          type: string
        moTa:
          type: string

    TripCreateRequest:
      type: object
      required: [maKH, diemDon, diemDen, maLoaiXe]
      properties:
        maKH:
          type: integer
          example: 1001
        diemDon:
          type: string
          example: 123 Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh
        diemDen:
          type: string
          example: 01 Đồng Khởi, Quận 1, TP. Hồ Chí Minh
        thoiGianDon:
          type: string
          format: date-time
          example: "2026-09-03T18:30:00+07:00"
        maLoaiXe:
          type: integer
          example: 1
        yeuCauDacBiet:
          type: string
          example: Có hành lý

    Trip:
      type: object
      properties:
        maChuyen:
          type: integer
          example: 3001
        maKH:
          type: integer
          example: 1001
        maTX:
          type: integer
          nullable: true
          example: 2001
        diemDon:
          type: string
        diemDen:
          type: string
        thoiGianDat:
          type: string
          format: date-time
        thoiGianDon:
          type: string
          format: date-time
        trangThai:
          type: string
          enum:
            - Đang tìm tài xế
            - Đã tìm thấy tài xế
            - Đang nhận chuyến
            - Đang đi
            - Hoàn thành
            - Đã hủy
            - Chờ thanh toán
        soTien:
          type: number
          format: double
          example: 85000

    DriverTripActionRequest:
      type: object
      required: [maTX]
      properties:
        maTX:
          type: integer
          example: 2001

    TripStatusRequest:
      type: object
      required: [trangThai]
      properties:
        trangThai:
          type: string
          enum:
            - Đang nhận chuyến
            - Đang đi
            - Hoàn thành

    LocationRequest:
      type: object
      required: [viTriHienTai]
      properties:
        viTriHienTai:
          type: string
          example: 10 Lê Lợi, Quận 1, TP. Hồ Chí Minh

    CancelTripRequest:
      type: object
      required: [nguoiHuy]
      properties:
        nguoiHuy:
          type: string
          enum: [Khách hàng, Tài xế]
        lyDo:
          type: string
          example: Có việc đột xuất

    FareResponse:
      type: object
      properties:
        maChuyen:
          type: integer
        khoangCach:
          type: number
          format: double
          example: 8.5
        thoiGian:
          type: number
          format: double
          example: 25
        tienXe:
          type: number
          format: double
          example: 70000
        phuPhi:
          type: number
          format: double
          example: 15000
        tongTien:
          type: number
          format: double
          example: 85000

    PaymentRequest:
      type: object
      required: [phuongThuc]
      properties:
        phuongThuc:
          type: string
          enum: [Tiền mặt, Điện tử]
          example: Điện tử

    Payment:
      type: object
      properties:
        maTT:
          type: integer
          example: 4001
        maChuyen:
          type: integer
          example: 3001
        phuongThuc:
          type: string
          enum: [Tiền mặt, Điện tử]
        soTien:
          type: number
          format: double
          example: 85000
        trangThai:
          type: string
          enum: [Chờ thanh toán, Thành công, Thất bại]
        thoiGianThanhToan:
          type: string
          format: date-time

    RatingRequest:
      type: object
      required: [maKH, maTX, soSao]
      properties:
        maKH:
          type: integer
          example: 1001
        maTX:
          type: integer
          example: 2001
        soSao:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        noiDung:
          type: string
          example: Tài xế thân thiện và đúng giờ.

    Rating:
      type: object
      properties:
        maDG:
          type: integer
          example: 6001
        maChuyen:
          type: integer
          example: 3001
        maKH:
          type: integer
          example: 1001
        maTX:
          type: integer
          example: 2001
        soSao:
          type: integer
          example: 5
        noiDung:
          type: string

    Report:
      type: object
      properties:
        tongSoChuyen:
          type: integer
          example: 1250
        tongDoanhThu:
          type: number
          format: double
          example: 125000000
        tyLeHoanThanh:
          type: number
          format: double
          example: 92.5
        tyLeHuy:
          type: number
          format: double
          example: 7.5
